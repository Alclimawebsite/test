[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "Bot de trading — état des lieux des indicateurs et prévision de direction (5/10/15 barres) avec Google TimesFM"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "yfinance>=0.2.40",
  "pyarrow>=14",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
timesfm = ["timesfm[torch]>=3.0.2"]
dev = ["pytest>=8"]

[project.scripts]
tradebot = "tradebot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
